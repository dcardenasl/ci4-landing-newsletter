<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="roundedClip">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#2563eb"/>

  <!-- Envelope body -->
  <g clip-path="url(#roundedClip)">
    <rect x="16" y="32" width="68" height="44" rx="5" ry="5" fill="#ffffff"/>

    <!-- Envelope flap (top triangle) -->
    <polygon points="16,32 50,58 84,32" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Envelope flap fill (white overlap to simulate open flap crease) -->
    <polyline points="16,32 50,56 84,32" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>

    <!-- Bottom corners lines -->
    <line x1="16" y1="76" x2="38" y2="55" stroke="#bfdbfe" stroke-width="1.5"/>
    <line x1="84" y1="76" x2="62" y2="55" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
</svg>
