<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none">
  <!-- Globe / Multiidioma icon -->
  <circle cx="28" cy="28" r="22" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- vertical meridian -->
  <ellipse cx="28" cy="28" rx="10" ry="22" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- horizontal parallels -->
  <path d="M6 28 Q28 20 50 28" stroke="currentColor" stroke-width="2" fill="none"/>
  <path d="M6 28 Q28 36 50 28" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- vertical axis -->
  <line x1="28" y1="6" x2="28" y2="50" stroke="currentColor" stroke-width="2"/>
  <!-- horizontal axis -->
  <line x1="6" y1="28" x2="50" y2="28" stroke="currentColor" stroke-width="2"/>
  <!-- highlight dot -->
  <circle cx="28" cy="28" r="3" fill="currentColor"/>
</svg>
