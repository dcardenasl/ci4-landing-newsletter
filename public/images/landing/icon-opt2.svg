<svg xmlns="http://www.w3.org/2000/svg" width="56" height="52" viewBox="0 0 56 52" fill="none">
  <!-- Terminal / Backend CI4 icon -->
  <!-- Screen body -->
  <rect x="3" y="3" width="50" height="36" rx="5" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Title bar line -->
  <line x1="3" y1="13" x2="53" y2="13" stroke="currentColor" stroke-width="2"/>
  <!-- Traffic lights -->
  <circle cx="11" cy="8" r="2.5" fill="currentColor"/>
  <circle cx="19" cy="8" r="2.5" fill="currentColor" opacity="0.5"/>
  <circle cx="27" cy="8" r="2.5" fill="currentColor" opacity="0.25"/>
  <!-- Code lines -->
  <!-- prompt -->
  <polyline points="9,22 14,27 9,32" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="17" y1="27" x2="34" y2="27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="33" x2="28" y2="33" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Stand -->
  <line x1="28" y1="39" x2="28" y2="47" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="47" x2="40" y2="47" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
