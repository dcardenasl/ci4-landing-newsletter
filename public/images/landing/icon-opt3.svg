<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none">
  <!-- API / Connection icon -->
  <!-- Central node -->
  <circle cx="28" cy="28" r="7" fill="currentColor"/>
  <!-- Outer nodes -->
  <circle cx="28" cy="7"  r="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="28" cy="49" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="7"  cy="28" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="49" cy="28" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Diagonal nodes -->
  <circle cx="11" cy="11" r="3" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
  <circle cx="45" cy="11" r="3" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
  <circle cx="11" cy="45" r="3" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
  <circle cx="45" cy="45" r="3" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
  <!-- Connector lines - cardinal -->
  <line x1="28" y1="11"  x2="28" y2="21"  stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="28" y1="35"  x2="28" y2="45"  stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="11" y1="28"  x2="21" y2="28"  stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="35" y1="28"  x2="45" y2="28"  stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Connector lines - diagonal -->
  <line x1="13" y1="13"  x2="21" y2="21"  stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="43" y1="13"  x2="35" y2="21"  stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="13" y1="43"  x2="21" y2="35"  stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="43" y1="43"  x2="35" y2="35"  stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5"/>
</svg>
